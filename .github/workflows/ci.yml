
name: IdeaBoard CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend Docker image
        run: docker build -t ideaboard-backend:latest ./backend

      - name: Build frontend Docker image
        run: docker build -t ideaboard-frontend:latest ./frontend
